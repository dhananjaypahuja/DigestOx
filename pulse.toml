# Customer Pulse configuration. See README.md for every key.

[pulse]
# Timezone for digest windows. A window covers whole local calendar days here; storage is UTC.
timezone = "America/Los_Angeles"

# Local state: the SQLite database. Relative to this file. Git ignores it.
state_dir = ".pulse"

# The vendor whose customers Pulse tracks. Messages from its own staff are kept as thread
# context but never counted as customer evidence. GitHub marks staff by authorAssociation.
[vendor]
name = "Bivo"
email_domains = ["bivo.example"]
slack_team_ids = ["T0BIVO0001"]

# The one model every task uses (decision 0012): the current Opus at high effort, with no
# fallback model, so saved results never drift. Changing these invalidates saved responses.
[llm]
model = "claude-opus-5-5"
effort = "high"
max_tokens = 16000
